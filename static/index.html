aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><div class="breadcrumb"><strong>School Face</strong><span class="divider">/</span><span data-t="attendance_page"></span></div><div class="top-actions"><span id="face" class="pill off" role="status"></span><button id="theme-toggle" class="icon-button" type="button" aria-label="Тёмная тема"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14a8 8 0 0 1-10-10 8 8 0 1 0 10 10Z"/></svg></button><button class="lang" id="lang" type="button" aria-label="Русский / Қазақша"></button><span class="user-avatar" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg></span><a href="/logout" class="logout" data-ui-label="logout"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H5v16h5m4-12 4 4-4 4m-5-4h11"/></svg></a></div></header><main id="content"><div class="page-heading"><div><p class="eyebrow" data-t="eyebrow"></p><h1 data-t="heading"></h1><p class="description" data-t="description"></p></div><a class="heading-action" href="/classes"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18M5 20V8l7-5 7 5v12M9 20v-5h6v5M9 9h.01M15 9h.01M9 12h.01M15 12h.01"/></svg><span data-t="manage_classes"></span></a></div><section class="summary-cards" aria-label="School Face"><div class="card summary-card "><div class="metric-top"><span data-t="all"></span><span class="metric-icon"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2m20 0v-2a4 4 0 0 0-3-3.9M16 3.2a4 4 0 0 1 0 7.6"/><circle cx="9" cy="7" r="4"/></svg></span></div><b id="c-all">—</b><span class="metric-line" aria-hidden="true"></span></div><div class="card summary-card green"><div class="metric-top"><span data-t="now_in"></span><span class="metric-icon"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3h6v18h-6M3 12h12m-4-4 4 4-4 4"/></svg></span></div><b id="c-in">—</b><span class="metric-line" aria-hidden="true"></span></div><div class="card summary-card amber"><div class="metric-top"><span data-t="gone"></span><span class="metric-icon"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3H4v18h6m0-9h12m-4-4 4 4-4 4"/></svg></span></div><b id="c-left">—</b><span class="metric-line" aria-hidden="true"></span></div><div class="card summary-card rose"><div class="metric-top"><span data-t="absent"></span><span class="metric-icon"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="7" r="4"/><path d="M2 21v-2a5 5 0 0 1 5-5h4m5 1 5 5m0-5-5 5"/></svg></span></div><b id="c-abs">—</b><span class="metric-line" aria-hidden="true"></span></div></section><section class="panel filter-panel"><div class="tools"><div class="filter-field"><label for="date" data-t="date_label"></label><input id="date" type="date"></div><div class="filter-field"><label for="cls" data-t="class_label"></label><select id="cls"></select></div><div class="filter-field"><label for="flt" data-t="status_label"></label><select id="flt"></select></div><div class="filter-field search-field"><label for="q" data-t="search_label"></label><div class="search-input"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="q" type="search"></div></div></div></section><div class="attendance-layout"><section class="panel journal-panel"><div class="panel-heading"><h2 data-t="journal"></h2><span id="shown" class="count-badge">—</span></div><p class="panel-subtitle" data-t="journal_hint"></p><div class="wrap"><table><thead><tr><th data-t="h_name" scope="col"></th><th data-t="h_class" scope="col"></th><th data-t="h_status" scope="col"></th><th data-t="h_first" scope="col"></th><th data-t="h_last" scope="col"></th></tr></thead><tbody id="body"></tbody></table></div><div class="empty-state" id="empty"></div></section><aside class="panel class-bars-panel"><div class="panel-heading"><h2 data-t="by_class"></h2><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18M5 20V8l7-5 7 5v12M9 20v-5h6v5M9 9h.01M15 9h.01M9 12h.01M15 12h.01"/></svg></div><p class="panel-subtitle" data-t="bars_hint"></p><div id="bars"></div><div id="bars-empty" class="empty-state"></div><div class="day-legend"><i aria-hidden="true"></i><span data-t="bars_legend"></span></div></aside></div><div class="note-block"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10h.01"/></svg><p><span data-t="note"></span> <span id="upd"></span></p></div></main>
<script>
const T = {
  kk: {
    eyebrow:"МЕКТЕП КЕҢІСТІГІ", heading:"Әр оқушы назарда", description:"Қатысу белгілері, келу уақыты және сыныптар туралы ақпарат — бір экранда.", manage_classes:"Сыныптарды басқару", date_label:"Күні", class_label:"Сынып", status_label:"Мәртебе", search_label:"Оқушыны іздеу", journal:"Қатысу журналы", journal_hint:"Кіру және шығу белгілерін көру үшін оқушы жолын басыңыз.", bars_hint:"Таңдалған күнгі келу белгілері", bars_legend:"Кемінде бір белгісі бар оқушылар", bars_empty:"Сыныптар әлі қосылмаған.",
    classes_page: "Сыныптар және Telegram", attendance_page: "Қатысу", checks_page: "Сынып тазалығын бағалау",
    title: "School Face · Қатысу", subtitle: "Оқушы мектепке келді ме, кетті ме",
    logout: "Шығу", all_classes: "Барлық сыныптар", all_status: "Барлық мәртебелер",
    inside: "Мектепте", left: "Кетті", absent: "Келген жоқ", search: "Аты-жөні бойынша іздеу",
    all: "Барлық оқушы", now_in: "Қазір мектепте", gone: "Кетіп қалды",
    by_class: "Сыныптар бойынша қатысу", h_name: "Оқушы", h_class: "Сынып", h_status: "Мәртебе",
    h_first: "Келген уақыты", h_last: "Соңғы белгі",
    face_on: "Face байланыста", face_off: "Face байланыста емес", no_site: "Сайтпен байланыс жоқ",
    IN: "Кіру", OUT: "Шығу", manual: " (қолмен)", no_events: "Осы күні белгілер жоқ",
    none: "Таңдалған шарттар бойынша оқушы жоқ.", empty: "Тізім бос: Face бағдарламасы әлі дерек жібермеген.",
    updated: "Жаңартылды ", other: "РУС",
    note: "Мәртебе таңдалған күнгі камера белгілері бойынша есептелген (UTC+5). Бұл адамның ғимаратта шынымен болғанының кепілі емес: тану қателері және есепке алынбаған кіріс болуы мүмкін. Барлық белгілерді көру үшін жолды басыңыз."
  },
  ru: {
    eyebrow:"ПРОСТРАНСТВО ШКОЛЫ", heading:"Каждый ученик на виду", description:"Отметки посещаемости, время прихода и информация о классах — на одном экране.", manage_classes:"Управление классами", date_label:"Дата", class_label:"Класс", status_label:"Статус", search_label:"Найти ученика", journal:"Журнал посещаемости", journal_hint:"Нажмите на ученика, чтобы увидеть отметки входа и выхода.", bars_hint:"Отметки за выбранный день", bars_legend:"Ученики хотя бы с одной отметкой", bars_empty:"Классы ещё не добавлены.",
    classes_page: "Классы и Telegram", attendance_page: "Присутствие", checks_page: "Оценка чистоты класса",
    title: "School Face · Присутствие", subtitle: "Пришёл ли ученик в школу и ушёл ли",
    logout: "Выйти", all_classes: "Все классы", all_status: "Все статусы",
    inside: "В школе", left: "Ушёл", absent: "Не пришёл", search: "Поиск по имени",
    all: "Всего учеников", now_in: "Сейчас в школе", gone: "Уже ушли",
    by_class: "Явка по классам", h_name: "Ученик", h_class: "Класс", h_status: "Статус",
    h_first: "Пришёл", h_last: "Последняя отметка",
    face_on: "Face на связи", face_off: "Face не на связи", no_site: "Нет связи с сайтом",
    IN: "Вход", OUT: "Выход", manual: " (вручную)", no_events: "Отметок за этот день нет",
    none: "Нет учеников по выбранным условиям.", empty: "Список пуст: программа Face ещё не отправляла данные.",
    updated: "Обновлено ", other: "ҚАЗ",
    note: "Статус рассчитан по отметкам камеры за выбранный день (UTC+5). Это не гарантия фактического нахождения человека в здании: возможны пропуски распознавания и неучтённые входы. Нажмите на строку, чтобы увидеть все отметки."
  }
};
const $ = id => document.getElementById(id);
let lang = "kk", data = null, open = new Set(), offline = false;
try { lang = localStorage.getItem("lang") === "ru" ? "ru" : "kk"; } catch (e) {}
const t = k => T[lang][k];
$("date").value = new Date(Date.now() + 5 * 3600e3).toISOString().slice(0, 10);

function el(tag, text, cls) {
  const e = document.createElement(tag);
  if (text !== undefined) e.textContent = text;
  if (cls) e.className = cls;
  return e;
}

function applyLang() {
  document.documentElement.lang = lang;
  document.title = t("title");
  document.querySelectorAll("[data-t]").forEach(n => n.textContent = t(n.dataset.t));
  $("q").placeholder = t("search");
  $("lang").textContent = t("other");
  const f = $("flt"), keep = f.value;
  f.replaceChildren(new Option(t("all_status"), ""), new Option(t("inside"), "inside"),
                    new Option(t("left"), "left"), new Option(t("absent"), "absent"));
  f.value = keep;
  $("date").setAttribute("aria-label",t("date_label"));
  if (data) render();
}

$("lang").onclick = () => {
  lang = lang === "kk" ? "ru" : "kk";
  try { localStorage.setItem("lang", lang); } catch (e) {}
  applyLang();
};

async function load() {
  try {
    const r = await fetch("/api/day?date=" + $("date").value, {cache: "no-store"});
    if (r.status === 401) { location.href = "/login"; return; }
    if (!r.ok) throw Error("load");
    data = await r.json();
    offline = false;
    render();
  } catch (e) {
    offline = true;
    $("face").className = "pill off";
    $("face").textContent = t("no_site");
  }
}

function render() {
  const f = $("face");
  f.className = "pill " + (data.face_online ? "on" : "off");
  f.textContent = data.face_online ? t("face_on") : t("face_off") + (data.last_sync ? " · " + data.last_sync : "");
  if (offline) { f.className = "pill off"; f.textContent = t("no_site"); }
  const sel = $("cls"), keep = sel.value;
  const groups = [...new Set(data.people.map(p => p.group))];
  sel.replaceChildren(new Option(t("all_classes"), ""), ...groups.map(g => new Option(g, g)));
  sel.value = groups.includes(keep) ? keep : "";
  const q = $("q").value.trim().toLowerCase(), g = sel.value, s = $("flt").value;
  const list = data.people.filter(p => (!g || p.group === g) && (!s || p.status === s) && (!q || p.name.toLowerCase().includes(q)));
  const scope = data.people.filter(p => !g || p.group === g);
  $("c-all").textContent = scope.length;
  $("c-in").textContent = scope.filter(p => p.status === "inside").length;
  $("c-left").textContent = scope.filter(p => p.status === "left").length;
  $("c-abs").textContent = scope.filter(p => p.status === "absent").length;
  $("shown").textContent = list.length;
  $("bars-empty").textContent = data.classes.length ? "" : t("bars_empty");
  const bars = $("bars"); bars.replaceChildren();
  data.classes.forEach(c => {
    const pct = c.total ? Math.round(100 * c.present / c.total) : 0;
    const row = el("div", undefined, "bar"), track = el("div", undefined, "track"), fill = el("div", undefined, "fill");
    fill.style.width = pct + "%"; track.append(fill);
    row.append(el("b", c.group), track, el("span", `${c.present}/${c.total} · ${pct}%`));
    bars.append(row);
  });
  const body = $("body"); body.replaceChildren();
  list.forEach(p => {
    const tr = el("tr", undefined, "row");
    const st = el("td"); st.append(el("span", t(p.status), "st " + p.status));
    const name = el("td"), person = el("span", undefined, "person-cell");
    const initials = p.name.trim().split(/\s+/).slice(0,2).map(n=>Array.from(n)[0]||"").join("").toUpperCase();
    const avatar = el("span", initials, "initials v" + (p.id % 4)); avatar.setAttribute("aria-hidden", "true");
    person.append(avatar, el("span",p.name)); name.append(person);
    tr.append(name, el("td", p.group), st, el("td", p.first_in || "—"), el("td", p.last_at || "—"));
    tr.tabIndex = 0; tr.setAttribute("aria-expanded", String(open.has(p.id)));
    tr.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); tr.click(); } });
    tr.dataset.personId = p.id;
    tr.onclick = () => { open.has(p.id) ? open.delete(p.id) : open.add(p.id); render(); $("body").querySelector(`[data-person-id="${p.id}"]`)?.focus({preventScroll:true}); };
    body.append(tr);
    if (open.has(p.id)) {
      const d = el("tr", undefined, "det"), td = el("td"); td.colSpan = 5;
      td.textContent = p.events.length ? p.events.map(e => `${e.at} ${t(e.kind)}${e.source === "manual" ? t("manual") : ""}`).join("  ·  ") : t("no_events");
      d.append(td); body.append(d);
    }
  });
  $("empty").textContent = data.people.length ? (list.length ? "" : t("none")) : t("empty");
  $("upd").textContent = t("updated") + data.server_time;
}

["date", "cls", "flt"].forEach(i => $(i).addEventListener("change", i === "date" ? load : render));
$("q").addEventListener("input", () => data && render());
applyLang();
load(); setInterval(load, 5000);
</script>
</body>
</html>
