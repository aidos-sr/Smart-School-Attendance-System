<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>School Face · Классы и Telegram</title>
<style>
:root{--bg:#eef4ff;--card:#fff;--ink:#14233f;--mute:#5d6f8c;--line:#d7e1f2;--blue:#1d5fd0;--good:#0b7a43;--bad:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#0e1626;--card:#16223a;--ink:#e8eefb;--mute:#a6b6d1;--line:#344665;--blue:#8ab7ff;--good:#7ee2a8;--bad:#ff9c9c}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;padding:16px 20px;background:var(--card);border-bottom:1px solid var(--line)}h1{margin:0;color:var(--blue);font-size:20px}h1 small{display:block;font-size:12px;color:var(--mute);font-weight:400;margin-top:4px}
main{max-width:1100px;margin:auto;padding:18px}nav,.actions{display:flex;gap:12px;flex-wrap:wrap}nav{margin-bottom:20px}a{color:var(--blue)}[aria-current=page]{font-weight:700}
button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.6;cursor:wait}input,select,button{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}input,select{width:100%}input[readonly]{background:var(--bg)}:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}h2{font-size:18px;margin:0 0 14px}h3{margin:0 0 8px;font-size:24px;color:var(--blue)}p{line-height:1.6}.muted{font-size:14px;color:var(--mute)}label{display:block;font-size:14px;font-weight:600}label input,label select{margin-top:7px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.check{display:flex;align-items:center;gap:10px;margin:14px 0}.check input{width:20px;height:20px;margin:0}.primary{background:#1d5fd0;color:#fff;border-color:#1d5fd0;font-weight:600}fieldset{border:0;padding:0;margin:0;min-width:0}.status{min-height:24px;color:var(--good);margin:12px 0}.error{color:var(--bad)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}.card p{margin:8px 0}.card .actions{margin-top:14px}.card button{font-size:13px;padding:8px 10px}.good{color:var(--good)}.badge{font-size:13px;font-weight:600}.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{font-size:14px;text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}th{color:var(--mute)}[hidden]{display:none!important}.lang{margin-right:12px}#refresh{margin-left:8px}#connection-url{margin:8px 0 12px}#roster-date{max-width:220px;margin-bottom:14px}
@media(max-width:650px){main{padding:14px}.grid{grid-template-columns:1fr}.panel{padding:16px}header{padding:14px}}
</style>
</head>
<body>
<header><h1>School Face<small data-t="subtitle"></small></h1><div><button id="lang" class="lang" type="button"></button><a href="/logout" data-t="logout"></a></div></header>
<main>
<nav aria-label="School Face"><a href="/" data-t="attendance"></a><a href="/class-checks" data-t="checks"></a><a href="/classes" aria-current="page" data-t="page"></a></nav>
<section class="panel"><h2 data-t="telegram"></h2><p id="bot-state" class="muted" role="status"></p><p class="muted" data-t="setup"></p><button id="refresh" type="button" data-t="refresh"></button></section>
<section class="panel">
<h2 id="form-title"></h2>
<form id="class-form"><fieldset id="fields" disabled>
<div class="grid"><label for="group"><span data-t="class"></span><input id="group" maxlength="60" autocomplete="off" required></label><label for="teacher"><span data-t="teacher"></span><input id="teacher" maxlength="120" autocomplete="off"></label></div>
<p class="muted" data-t="names_hint"></p>
<label for="language"><span data-t="message_language"></span><select id="language"><option value="ru">Русский</option><option value="kk">Қазақша</option></select></label>
<label class="check"><input type="checkbox" id="notify-in" checked><span data-t="notify_in"></span></label>
<label class="check"><input type="checkbox" id="notify-out"><span data-t="notify_out"></span></label>
<div class="grid"><label for="report-time"><span data-t="report_time"></span><input id="report-time" type="time"></label><label for="report-days"><span data-t="report_days"></span><select id="report-days"><option value="weekdays" data-t="weekdays"></option><option value="six_days" data-t="six_days"></option><option value="daily" data-t="daily"></option></select></label></div>
<p class="muted" data-t="schedule_hint"></p><p class="muted" data-t="teacher_hint"></p>
<div class="actions"><button type="submit" class="primary" data-t="save"></button><button type="button" id="new" data-t="new"></button></div>
</fieldset></form>
</section>
<p id="status" class="status" role="status" aria-live="polite"></p>
<section id="connection" class="panel" hidden><h2 id="connection-title"></h2><p class="muted" data-t="link_hint"></p><label for="connection-url" data-t="personal_link"></label><input id="connection-url" readonly><button type="button" id="copy" data-t="copy"></button><p class="muted" data-t="link_warning"></p></section>
<section><h2 data-t="class_list"></h2><p class="muted" data-t="list_hint"></p><div id="classes" class="cards"></div><p id="empty" class="muted"></p></section>
<section id="roster" class="panel" style="margin-top:18px" hidden><h2 id="roster-title"></h2><label for="roster-date" data-t="date"></label><input id="roster-date" type="date"><p class="muted" data-t="roster_hint"></p><div class="wrap"><table><thead><tr><th data-t="student"></th><th data-t="arrival"></th><th data-t="state"></th></tr></thead><tbody id="roster-body"></tbody></table></div><p class="muted" id="roster-empty"></p></section>
</main>

kk:{report_time:'Автоматты жиынтық уақыты (UTC+5)',report_days:'Жиынтық жіберілетін күндер',weekdays:'Дүйсенбі — жұма',six_days:'Дүйсенбі — сенбі',daily:'Күн сайын',schedule_hint:'Жиынтықты өшіру үшін уақытты бос қалдырыңыз. Бот сол уақытта кім келгенін және кімде белгі жоқ екенін жібереді. Бот кеш іске қосылса, сол күннің жиынтығын іске қосылғанда жібереді. /today кез келген уақытта қолжетімді.',scheduled:'Жиынтық',subtitle:'Сыныптар, жетекшілер және хабарламалар',logout:'Шығу',attendance:'Қатысу',checks:'Сынып тазалығын бағалау',page:'Сыныптар және Telegram',telegram:'Telegram-бот',setup:'@BotFather арқылы бот құрыңыз, TELEGRAM_BOT_TOKEN мәнін орнатып, telegram_worker.py файлын іске қосыңыз. Нұсқаулық архивтегі TELEGRAM_SETUP_RU.md файлында.',refresh:'Мәртебені жаңарту',class:'Сынып',teacher:'Сынып жетекшісі',names_hint:'Атау Face жүйесіндегі сыныппен дәл сәйкес келуі керек, мысалы 8А. Оқушылар тізімі Face жүйесінен жаңартылады. Қолданыстағы сыныптың атауы Face жүйесінде өзгертіледі.',message_language:'Жетекшіге хабарлама тілі',notify_in:'Оқушының келгені мен белгі уақытын хабарлау',notify_out:'Оқушының кеткені мен белгі уақытын хабарлау',teacher_hint:'Жетекші өзгерсе, бұрынғы Telegram байланысы ажыратылады. Жаңа жетекшіге жаңа сілтеме жасаңыз.',save:'Сыныпты сақтау',new:'Басқа сыныпты қосу',add:'Сынып қосу',edit_title:'Сынып баптаулары',class_list:'Сыныптарыңыз',list_hint:'Қатысу тізіміндегі сыныптар автоматты түрде көрсетіледі. Жаңа сыныпты жоғарыдағы форма арқылы қосуға болады.',empty:'Әзірше сынып жоқ. Бірінші сыныпты қосыңыз.',edit:'Баптау',connect:'Telegram қосу',reconnect:'Жаңа сілтеме',disconnect:'Ажырату',report:'Telegram-ға жиынтық',students:'Оқушылар',count:'Оқушылар саны',no_teacher:'Жетекші көрсетілмеген',connected:'Telegram қосылған',not_connected:'Telegram қосылмаған',pending:'Кезекте',failed:'Жеткізу қателері',on:'қосулы',off:'өшірулі',arrival_short:'Келуі',departure_short:'Кетуі',loading:'Жүктелуде…',saved:'Сынып сақталды.',error:'Әрекет орындалмады. Байланысты тексеріп, қайталаңыз.',exists:'Мұндай сынып бар. Карточкадағы «Баптау» түймесін басыңыз.',unconfigured:'Алдымен бот токенімен telegram_worker.py файлын іске қосыңыз. Содан кейін мәртебені жаңартыңыз.',report_queued:'Жиынтық кезекке қойылды. Оны жұмыс істеп тұрған Telegram-бот жібереді.',disconnected:'Telegram ажыратылды. Кезектегі хабарламалар тоқтатылды.',link_ready:'Сілтеме дайын. Оны сынып жетекшісіне жеке жіберіңіз.',personal_link:'Жеке қосылу сілтемесі',link_hint:'Сілтеме 1 сағатқа және бір ретке жарамды. Жетекші оны Telegram-да ашып, «Бастау / Start» түймесін басады. Бүгінгі қатысуды көру үшін /today командасын жібереді.',link_warning:'Жаңа сілтеме жасалса, бұрынғы алушы ажыратылады. Сілтемені ортақ чатқа жарияламаңыз. Байланысты тексеру үшін мәртебені жаңартыңыз.',copy:'Сілтемені көшіру',copied:'Сілтеме көшірілді.',copy_manual:'Өрістегі сілтемені белгілеп, көшіріңіз.',bot_online:'Бот жұмыс істеп тұр',bot_offline:'Бот байланыста емес — telegram_worker.py файлын іске қосыңыз',bot_missing:'Бот әлі бапталмаған',bot_error:'Боттың Telegram байланысында қате бар',student:'Оқушы',arrival:'Алғаш келген уақыты',state:'Белгілер бойынша мәртебе',inside:'Мектепте',left:'Кетті',absent:'Белгі жоқ',date:'Күні',roster_hint:'Face белгілері бойынша. Камерамен байланыс болмаса, деректер кешігуі мүмкін. Белгінің болмауы оқушының келмегенін дәлелдемейді.',roster_empty:'Бұл сыныптың оқушылары Face жүйесінен әлі синхрондалмаған.',other:'РУС',group_error:'Сынып атауын енгізіңіз.'}
};
const $=id=>document.getElementById(id);
let lang='kk',data=null,selected=null,rosterGroup=null,rosterData=null,busy=false,loadId=0,rosterId=0,message='',messageError=false,connectionName='';
try{lang=localStorage.getItem('lang')==='ru'?'ru':'kk';}catch(e){}
const t=k=>T[lang][k];
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;}
function status(key,error=false){message=key;messageError=error;$('status').textContent=key?t(key):'';$('status').className='status'+(error?' error':'');}
function botState(){if(!data)return;$('bot-state').textContent=(data.telegram.username?'@'+data.telegram.username+' · ':'')+t(!data.telegram.username?'bot_missing':data.telegram.last_error?'bot_error':data.telegram.online?'bot_online':'bot_offline');}
function render(){
 $('form-title').textContent=t(selected?'edit_title':'add');botState();$('classes').replaceChildren();
 if(!data)return;$('empty').textContent=data.classes.length?'':t('empty');
 for(const row of data.classes){
  const card=el('article',undefined,'card');card.append(el('h3',row.group_name),el('p',row.teacher_name||t('no_teacher')),el('p',t('count')+': '+row.student_count,'muted'),el('p',t(row.telegram_connected?'connected':'not_connected'),'badge'+(row.telegram_connected?' good':'')));
  card.append(el('p',t('arrival_short')+': '+t(row.notify_in?'on':'off')+' · '+t('departure_short')+': '+t(row.notify_out?'on':'off'),'muted'));
  if(row.pending||row.failed)card.append(el('p',t('pending')+': '+row.pending+' · '+t('failed')+': '+row.failed,row.failed?'error':'muted'));
  if(row.report_time)card.append(el('p',t('scheduled')+': '+row.report_time+' · '+t(row.report_days)+' (UTC+5)','muted'));
  const actions=el('div',undefined,'actions');
  function button(key,fn){const b=el('button',t(key));b.type='button';b.disabled=busy;b.addEventListener('click',fn);actions.append(b);}
  button('edit',()=>edit(row));button('students',()=>showRoster(row));
  button(row.telegram_connected?'reconnect':'connect',()=>action(row,'link'));
  if(row.telegram_connected){button('report',()=>action(row,'report'));button('disconnect',()=>action(row,'disconnect'));}
  card.append(actions);$('classes').append(card);
 }
}
function applyLang(){document.documentElement.lang=lang;document.title='School Face · '+t('page');document.querySelectorAll('[data-t]').forEach(n=>n.textContent=t(n.dataset.t));$('lang').textContent=t('other');render();renderRoster();if(connectionName)$('connection-title').textContent=connectionName+' · Telegram';status(message,messageError);}
function reset(){selected=null;$('group').readOnly=false;$('class-form').reset();$('language').value=lang;$('connection').hidden=true;$('form-title').textContent=t('add');status('');}
function edit(row){selected=row.id;$('group').value=row.group_name;$('group').readOnly=true;$('teacher').value=row.teacher_name;$('language').value=row.language;$('notify-in').checked=!!row.notify_in;$('notify-out').checked=!!row.notify_out;$('report-time').value=row.report_time;$('report-days').value=row.report_days;$('form-title').textContent=t('edit_title');$('connection').hidden=true;$('teacher').focus();status('');}
function setBusy(value){busy=value;$('fields').disabled=value||!data;$('refresh').disabled=value;$('lang').disabled=value;render();}
async function api(url,options={}){const r=await fetch(url,{cache:'no-store',...options});if(r.status===401){location.href='/login';throw Error('login');}const body=await r.json();if(!r.ok){const e=Error(body.error);e.code=body.error;throw e;}return body;}
async function load(){const id=++loadId;try{const result=await api('/api/classes');if(id!==loadId)return;data=result;$('fields').disabled=busy;render();}catch(e){if(id===loadId)status('error',true);}}
async function action(row,action){if(!data||busy)return;setBusy(true);status('loading');try{const result=await api('/api/classes/'+row.id+'/telegram/'+action,{method:'POST',headers:{'X-CSRF-Token':data.csrf_token}});await load();if(action==='link'){connectionName=row.group_name;$('connection-title').textContent=row.group_name+' · Telegram';$('connection-url').value=result.url;$('connection').hidden=false;status('link_ready');}else{$('connection').hidden=true;status(action==='report'?'report_queued':'disconnected');}}catch(e){status(e.code==='telegram unconfigured'?'unconfigured':'error',true);}finally{setBusy(false);}}
$('class-form').addEventListener('submit',async event=>{event.preventDefault();if(busy||!data||!$('class-form').reportValidity())return;if(!$('group').value.trim()){status('group_error',true);return;}setBusy(true);try{const payload={group:$('group').value.trim(),teacher:$('teacher').value.trim(),language:$('language').value,notify_in:$('notify-in').checked,notify_out:$('notify-out').checked,report_time:$('report-time').value,report_days:$('report-days').value};if(selected)payload.id=selected;const result=await api('/api/classes',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':data.csrf_token},body:JSON.stringify(payload)});selected=result.id;$('group').readOnly=true;$('connection').hidden=true;await load();status('saved');}catch(e){status(e.code==='class exists'?'exists':'error',true);}finally{setBusy(false);}});
function renderRoster(){if(!rosterGroup)return;$('roster-title').textContent=rosterGroup.group_name+' · '+t('students');$('roster-body').replaceChildren();if(!rosterData)return;const people=rosterData.people.filter(p=>p.group===rosterGroup.group_name);for(const person of people){const row=el('tr');row.append(el('td',person.name),el('td',person.first_in||'—'),el('td',t(person.status)));$('roster-body').append(row);}$('roster-empty').textContent=people.length?'':t('roster_empty');}
async function showRoster(group){rosterGroup=group;rosterData=null;$('roster').hidden=false;$('roster-empty').textContent=t('loading');renderRoster();const id=++rosterId;try{const result=await api('/api/day?date='+encodeURIComponent($('roster-date').value));if(id!==rosterId)return;rosterData=result;renderRoster();}catch(e){if(id===rosterId)$('roster-empty').textContent=t('error');}}
$('new').addEventListener('click',reset);$('refresh').addEventListener('click',()=>{status('');load();});$('roster-date').addEventListener('change',()=>rosterGroup&&showRoster(rosterGroup));
$('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText($('connection-url').value);status('copied');}catch(e){$('connection-url').select();status('copy_manual');}});
$('lang').addEventListener('click',()=>{lang=lang==='ru'?'kk':'ru';try{localStorage.setItem('lang',lang);}catch(e){}applyLang();});
$('roster-date').value=new Date(Date.now()+5*3600e3).toISOString().slice(0,10);$('language').value=lang;applyLang();load();setInterval(()=>{if(!busy&&!document.hidden)load();},10000);
</script>
</body></html>
